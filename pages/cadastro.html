<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kwalidade - Cadastro</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/form.css" />
  </head>
  <body>
    <nav>
      <a href="../index.html" class="return-form">
        <img src="../img/volta_pagina.png" alt="Voltar para Home" />
      </a>
    </nav>

    <main>
      <section>
        <h2 class="form-tittle">Cadastro</h2>

        <article>
          <form
            action="../index.html"
            onsubmit="
              alert('Cadastrado!');
              return true;
            "
          >
            <label for="name">
              Nome:
              <input
                type="text"
                id="name"
                placeholder="Digite seu nome"
                maxlength="40"
                required
              />
            </label>

            <label for="email">
              Email:
              <input
                type="email"
                id="email"
                placeholder="Digite seu email"
                maxlength="100"
                required
              />
            </label>

            <label for="password">
              Senha:
              <input
                type="password"
                id="password"
                placeholder="Digite sua senha"
                maxlength="70"
                required
              />
            </label>

            <label for="confirm-password">
              Confirme sua senha:
              <input
                type="password"
                id="confirm-password"
                placeholder="Confirme sua senha"
                maxlength="70"
                required
              />
            </label>

            <label for="rg">
              RG:
              <input
                type="text"
                id="rg"
                placeholder="Digite seu RG"
                minlength="7"
                maxlength="9"
                required
              />
            </label>

            <label for="cpf">
              CPF:
              <input
                type="text"
                id="cpf"
                placeholder="Digite seu CPF"
                minlength="11"
                maxlength="11"
                required
              />
            </label>

            <label for="adress">
              Endereço:
              <input
                type="text"
                id="adress"
                placeholder="Digite seu endereço"
                maxlength="100"
                required
              />
            </label>

            <label for="cep">
              CEP:
              <input
                type="text"
                id="cep"
                placeholder="Digite seu CEP"
                minlength="8"
                maxlength="8"
                required
              />
            </label>

            <label for="city">
              Cidade:
              <input
                type="text"
                id="city"
                placeholder="Digite o nome da sua cidade"
                maxlength="40"
                required
              />
            </label>

            <label for="state">
              Estado:
              <input
                type="text"
                id="state"
                placeholder="Digite o nome do seu estado"
                maxlength="40"
                required
              />
            </label>

            <label for="country">
              País:
              <input
                type="text"
                id="country"
                placeholder="Digite o nome do seu país"
                maxlength="40"
                required
              />
            </label>

            <label for="born-date">
              Data de nascimento:
              <input type="date" id="born-date" required />
            </label>

            <button type="submit">Cadastrar</button>
          </form>

          <img src="../img/cadastro.png" alt="Cadastre-se" />
        </article>
      </section>
    </main>
    <footer>
      <h2 class="logo">Kwalidade</h2>

      <p>&copy;Todos os direitos reservados 2026</p>
    </footer>
  </body>
</html>
