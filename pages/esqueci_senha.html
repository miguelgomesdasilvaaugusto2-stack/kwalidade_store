<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kwalidade - Recuperação de senha</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/form.css" />
  </head>

  <body>
    <nav>
      <a href="login.html" class="return-form">
        <img src="../img/volta_pagina.png" alt="Voltar para Home" />
      </a>
    </nav>

    <main>
      <section>
        <h2 class="form-tittle">Recuperação de senha</h2>

        <article>
          <form
            action="login.html"
            onsubmit="
              alert('Certo! Agora pode fazer login!');
              return true;
            "
          >
            <label for="email">
              Email:
              <input
                type="email"
                id="email"
                placeholder="Digite seu email"
                maxlength="100"
                required
              />
            </label>

            <button type="submit">Enviar</button>
          </form>

          <img
            src="../img/email.png"
            alt="Recupere sua senha digitando no email"
          />
        </article>
      </section>
    </main>

    <footer>
      <h2 class="logo">Kwalidade</h2>

      <p>&copy;Todos os direitos reservados 2026</p>
    </footer>
  </body>
</html>
